[project]
name = "tpa"
version = "0.1.0"
description = "Trade promotion autonomy — Cal Hacks 13.0, Hyphenate track"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "anthropic>=2.3.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
